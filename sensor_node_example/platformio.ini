[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = min_spiffs.csv
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps = 
    sensirion/Sensirion I2C SCD4x @ ^0.4.0

